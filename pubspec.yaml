name: morad_tk_app
description: تطبيق منصة MORAD_TK للتحكم بلوحات IoT محلياً وسحابياً
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # الاكتشاف المحلي عبر mDNS
  multicast_dns: ^0.3.2+6

  # الاتصال المحلي الفوري باللوحة
  web_socket_channel: ^2.4.0

  # السحابة
  firebase_core: ^2.27.0
  firebase_database: ^10.4.0
  firebase_auth: ^4.17.0
  cloud_functions: ^4.6.0

  # إدارة الحالة
  provider: ^6.1.2

  # تخزين محلي بسيط (طابور الأوامر المعلّقة، آخر لوحة متصلة)
  shared_preferences: ^2.2.2

  # طلب صلاحية الموقع (إلزامية على Android 12+ لعمل اكتشاف mDNS)
  permission_handler: ^11.3.0

  # أدوات عامة
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
